# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_version:
        description: Android major version of the target device
        required: true
        default: '16'
      kernel_version:
        description: Linux kernel MAJOR version of the target device
        required: true
        default: '6.12'
      android_abi:
        description: ABI for the mgz CLI
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

env:
  ANDROID_VERSION: ${{ inputs.android_version || '16' }}
  KERNEL_VERSION: ${{ inputs.kernel_version || '6.12' }}
  KMI: android${{ inputs.android_version || '16' }}-${{ inputs.kernel_version || '6.12' }}
  ABI: ${{ inputs.android_abi || 'arm64-v8a' }}

jobs:
  kernel-modules:
    name: Kernel modules (android${{ inputs.android_version || '16' }}-${{ inputs.kernel_version || '6.12' }})
    runs-on: ubuntu-latest
    # The DDK image carries the prepared kernel build directory for one KMI,
    # including Module.symvers. That is all we need from the kernel, so no
    # kernel source is fetched and nothing of the kernel is compiled.
    container:
      image: ghcr.io/ylarod/ddk:android${{ inputs.android_version || '16' }}-${{ inputs.kernel_version || '6.12' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the DDK kernel directory
        run: |
          echo "DDK_ROOT=${DDK_ROOT:-/opt/ddk}"
          ls "${DDK_ROOT:-/opt/ddk}/kdir"
          ls "${DDK_ROOT:-/opt/ddk}/kdir/${KMI}" | head

      - name: Build gzvm_probe.ko and gzvm_unlock.ko
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-modules.sh --kmi "${KMI}" --src kernel --out dist/modules

      - uses: actions/upload-artifact@v4
        with:
          name: gzvm-modules-${{ env.KMI }}
          path: dist/modules/*.ko
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: ${{ fromJSON(inputs.android_abi && format('["{0}"]', inputs.android_abi) || '["arm64-v8a", "armeabi-v7a"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build mgz
        run: |
          cmake -B build \
            -DMGZ_ANDROID_VERSION="${ANDROID_VERSION}" \
            -DMGZ_KERNEL_VERSION="${KERNEL_VERSION}" \
            -DMGZ_ANDROID_ABI="${{ matrix.abi }}" \
            -DMGZ_ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake --build build --target mgz
          ls -l build/out/*/mgz

      - uses: actions/upload-artifact@v4
        with:
          name: mgz-${{ matrix.abi }}-${{ env.KMI }}
          path: build/out/*/mgz
          if-no-files-found: error

  package:
    name: Package KernelSU module
    runs-on: ubuntu-latest
    needs: [kernel-modules, cli]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Make sure zip is available
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ env.KMI }}'
          path: artifacts

      - name: Assemble output directory
        run: |
          OUTDIR="build/out/${ABI}-${KMI}"
          mkdir -p "$OUTDIR"
          find artifacts -path '*gzvm-modules*' -name '*.ko' -exec cp {} "$OUTDIR"/ \;
          find artifacts -path "*mgz-${ABI}-*" -name 'mgz' -exec cp {} "$OUTDIR"/ \;
          ls -l "$OUTDIR"

      - name: Package
        run: |
          cmake -B build \
            -DMGZ_ANDROID_VERSION="${ANDROID_VERSION}" \
            -DMGZ_KERNEL_VERSION="${KERNEL_VERSION}" \
            -DMGZ_ANDROID_ABI="${ABI}" \
            -DMGZ_ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake --build build --target ksu_module

      - uses: actions/upload-artifact@v4
        with:
          name: mgz-bundle-${{ env.KMI }}
          path: build/out/*/*.zip
          if-no-files-found: error
