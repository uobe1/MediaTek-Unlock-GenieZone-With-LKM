# SPDX-License-Identifier: GPL-3.0-or-later
#
# Prebuilt release bundles for every GKI KMI generation.
#
# Triggered by pushing a version tag (0.1.1 or v0.1.1) — and only by that.
# The mgz CLI is built once — it does not depend on the kernel version —
# while the kernel modules are built per KMI inside the matching DDK
# container. Every KMI then gets its own KernelSU module zip, and all of
# them land in one GitHub release.
#
# Manual dispatch exists for re-running the matrix build by hand; it builds
# everything but does not publish a release.

name: Release

on:
  push:
    tags: ['*.*.*', 'v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ABI: arm64-v8a

jobs:
  cli:
    name: CLI (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build mgz
        run: |
          cmake -B build -DMGZ_ANDROID_ABI="${ABI}" \
            -DMGZ_ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake --build build --target mgz

      - uses: actions/upload-artifact@v4
        with:
          name: mgz-${{ env.ABI }}
          path: build/out/*/mgz
          if-no-files-found: error

  kernel-modules:
    name: Kernel modules (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The DDK image carries the prepared kernel build directory (with
        # Module.symvers) for one KMI, so nothing of the kernel is compiled.
        include:
          - kmi: android12-5.10
          - kmi: android13-5.10
          - kmi: android13-5.15
          - kmi: android14-5.15
          - kmi: android14-6.1
          - kmi: android15-6.6
          - kmi: android16-6.12
          - kmi: android17-6.18
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}
    steps:
      - uses: actions/checkout@v4

      - name: Build gzvm_probe.ko and gzvm_unlock.ko
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-modules.sh --kmi "${{ matrix.kmi }}" --src kernel \
            --out dist/modules

      - uses: actions/upload-artifact@v4
        with:
          name: gzvm-modules-${{ matrix.kmi }}
          path: dist/modules/*.ko
          if-no-files-found: error

  package:
    name: Package (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    needs: [cli, kernel-modules]
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
          - kmi: android13-5.10
          - kmi: android13-5.15
          - kmi: android14-5.15
          - kmi: android14-6.1
          - kmi: android15-6.6
          - kmi: android16-6.12
          - kmi: android17-6.18
    steps:
      - uses: actions/checkout@v4

      - name: Make sure zip is available
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - uses: actions/download-artifact@v4
        with:
          name: mgz-${{ env.ABI }}
          path: artifacts/mgz

      - uses: actions/download-artifact@v4
        with:
          name: gzvm-modules-${{ matrix.kmi }}
          path: artifacts/ko

      - name: Assemble and package the KernelSU module
        run: |
          KMI="${{ matrix.kmi }}"
          ANDROID_VERSION="${KMI#android}"; ANDROID_VERSION="${ANDROID_VERSION%%-*}"
          KERNEL_VERSION="${KMI##*-}"
          OUTDIR="build/out/${ABI}-${KMI}"
          mkdir -p "$OUTDIR"
          cp artifacts/ko/*.ko "$OUTDIR"/
          cp artifacts/mgz/mgz "$OUTDIR"/
          cmake -B build \
            -DMGZ_ANDROID_VERSION="${ANDROID_VERSION}" \
            -DMGZ_KERNEL_VERSION="${KERNEL_VERSION}" \
            -DMGZ_ANDROID_ABI="${ABI}"
          cmake --build build --target ksu_module

      - uses: actions/upload-artifact@v4
        with:
          name: mgz-bundle-${{ matrix.kmi }}
          path: build/out/*/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'mgz-bundle-*'
          path: zips
          merge-multiple: true

      - name: Create the release and upload the bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l zips
          gh release create "${TAG}" \
            --title "mgz ${TAG}" \
            --generate-notes \
            --notes "One prebuilt KernelSU module bundle per GKI KMI generation: android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12, android17-6.18. Install the zip matching your device KMI (see uname -r); each bundle ships the gzvm modules, the mgz CLI, a webui panel and a volume-key action menu." \
            zips/*.zip
